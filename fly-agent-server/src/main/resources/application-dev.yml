server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/fly_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456789}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

  redis:
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6379}
    database: ${SPRING_REDIS_DATABASE:0}
    password: ${SPRING_REDIS_PASSWORD:homeX}

logging:
  level:
    root: INFO
    com.fly.agent: DEBUG

swe:
  qwen-attempts: ${SWE_QWEN_ATTEMPTS:4}
  opus-attempts: ${SWE_OPUS_ATTEMPTS:8}
  qwen-max-steps-schedule: ${SWE_QWEN_MAX_STEPS_SCHEDULE:100,80,10,10}
  opus-max-steps-schedule: ${SWE_OPUS_MAX_STEPS_SCHEDULE:180,50,10}
  swe-agent:
    maxSteps: 20

  github:
    token: ${GITHUB_TOKEN:}

  qwen:
    base-url: ${SWE_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    token: ${SWE_QWEN_TOKEN:}
    model: ${SWE_QWEN_MODEL:qwen3.6-plus}
    max-input-tokens: 22000

  opus:
    base-url: ${SWE_OPUS_BASE_URL:https://ai.yiqiu.dev/v1}
    token: ${SWE_OPUS_TOKEN:}
    model: claude-opus-4-7

ale:
  codex-binary: ${ALE_CODEX_BINARY:codex}
  output-root: ${ALE_OUTPUT_ROOT:/data/fly-agent/ale-runs}
  framework-root: ${ALE_FRAMEWORK_ROOT:/home/ubuntu/agents-last-exam}
  queue-dir: ${ALE_QUEUE_DIR:/data/fly-agent/ale-runs/.queue}
  codex-models: ${ALE_CODEX_MODELS:gpt-5.5,gpt-5-mini,gpt-5-codex}
  stage1-timeout-minutes: ${ALE_STAGE1_TIMEOUT_MIN:90}
  stage2-timeout-minutes: ${ALE_STAGE2_TIMEOUT_MIN:240}
